<ul class="navbar-nav ms-auto">
    {% if user.is_authenticated %}
        <li class="nav-item">
            <span class="nav-link text-white fw-bold">
                {{ user.first_name }} {{ user.last_name }} ({{ user.get_role_display }})
            </span>
        </li>
        {% if user.is_staff %}
            <li class="nav-item">
                <a class="nav-link btn btn-outline-warning btn-sm text-white ms-2 px-3" href="/admin/">Admin Panel</a>
            </li>
        {% endif %}
        <li class="nav-item">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Chiqish</button>
            </form>
        </li>
    {% else %}
        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Kirish</a></li>
        <li class="nav-item"><a class="nav-link btn btn-primary text-white btn-sm ms-2" href="{% url 'register_student' %}">Talaba ro'yxati</a></li>
        <li class="nav-item"><a class="nav-link btn btn-outline-light btn-sm ms-2" href="{% url 'register_teacher' %}">O'qituvchi ro'yxati</a></li>
    {% endif %}
</ul>
