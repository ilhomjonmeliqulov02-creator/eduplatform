<div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-4">
    {% if user.is_authenticated %}
        <div class="alert alert-success w-100">
            Siz muvaffaqiyatli tizimga kirgansiz! Profilingiz tasdiqlanish jarayonida.
        </div>
    {% else %}
        <a href="{% url 'register_student' %}" class="btn btn-primary btn-lg px-4 me-sm-3">Talaba bo'lib ro'yxatdan o'tish</a>
        <a href="{% url 'register_teacher' %}" class="btn btn-outline-primary btn-lg px-4 me-sm-3">O'qituvchi bo'lib ro'yxatdan o'tish</a>
        <a href="{% url 'login' %}" class="btn btn-dark btn-lg px-4">Kirish</a>
    {% endif %}
</div>
