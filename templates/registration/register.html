{% extends 'base.html' %}

{% block title %}Ro'yxatdan o'tish - EduPlatform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center fw-bold mb-4" style="color: #4f46e5;">Ro'yxatdan o'tish</h3>
            
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 mb-3">A'zo bo'lish</button>
            </form>
            
            <div class="text-center">
                <small class="text-muted">Allaqachon hisobingiz bormi? <a href="{% url 'login' %}" class="text-decoration-none">Tizimga kirish</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
